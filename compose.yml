services:
  inference:
    container_name: ${CONTAINER_NAME:-glm-5.3-flash}
    hostname: ${NODE_NAME}
    network_mode: host
    ipc: host
    shm_size: 500gb
    privileged: true
    restart: always
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 100m
        max-file: "5"
    entrypoint: ["bash", "/opt/multideploy/node-entrypoint.sh"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_RANK: ${NODE_RANK}
      NODE_IP: ${NODE_IP}
      HEAD_IP: ${HEAD_IP}
      EXPECTED_NIC: ${EXPECTED_NIC:-}
      MODEL_DIR: /models/current
      PORT: ${PORT:-8080}
      SERVICE_START_TIMEOUT: ${SERVICE_START_TIMEOUT:-1800}
      HEALTH_INTERVAL: ${HEALTH_INTERVAL:-30}
      HEALTH_FAILURE_THRESHOLD: ${HEALTH_FAILURE_THRESHOLD:-3}
      # vLLM 的 /health 可在短暂拥塞或集群重连期间失败；默认只记录
      # Docker health 状态，不以一次瞬态失败主动重启整个 DP 集群。
      ACTIVE_HEALTH_RESTART: ${ACTIVE_HEALTH_RESTART:-false}
    devices:
      - /dev/davinci0
      - /dev/davinci1
      - /dev/davinci2
      - /dev/davinci3
      - /dev/davinci4
      - /dev/davinci5
      - /dev/davinci6
      - /dev/davinci7
      - /dev/davinci_manager
      - /dev/devmm_svm
      - /dev/hisi_hdc
    volumes:
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
      - /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro
      - /usr/local/sbin:/usr/local/sbin:ro
      - /etc/hccn.conf:/etc/hccn.conf:ro
      - /etc/localtime:/etc/localtime:ro
      - ${MODEL_HOST_PATH}:/models/current:ro
      - ${LOG_HOST_PATH:-/data/logs/glm53-flash}:/data/logs
      - ./scripts/node-entrypoint.sh:/opt/multideploy/node-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$$NODE_RANK\" = 0 ]; then curl --fail --silent --output /dev/null --max-time 5 \"http://127.0.0.1:$$PORT/health\"; else pgrep -f '[v]llm serve' >/dev/null; fi"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30m
