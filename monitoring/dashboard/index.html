<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>vLLM 性能诊断台</title>
<style>
:root{color-scheme:dark;--bg:#080b10;--panel:#111722;--line:#253044;--text:#edf3ff;--muted:#91a0b8;--green:#55d68b;--yellow:#ffca58;--red:#ff6577;--blue:#6ba6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#162747 0,transparent 30%),var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}h1{font-size:30px;margin:2px 0}.eyebrow{color:var(--blue);font-weight:700;letter-spacing:.12em}.muted,.metric p{color:var(--muted)}button{border:0;border-radius:7px;background:var(--blue);color:#061125;padding:10px 15px;font-weight:750;cursor:pointer}.ghost{background:#1b2638;color:var(--text);margin-left:8px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px}.section-head h2{font-size:17px;margin:0}.findings,.metrics{display:grid;gap:10px}.findings{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.finding,.metric{border:1px solid var(--line);background:linear-gradient(145deg,#121a27,#0e141e);border-radius:10px;padding:15px}.finding{border-left:4px solid var(--green)}.finding.warning{border-left-color:var(--yellow)}.finding.critical{border-left-color:var(--red)}.finding b{display:block;font-size:16px;margin:5px 0}.tag{font-size:11px;font-weight:800;color:var(--green);text-transform:uppercase}.warning .tag{color:var(--yellow)}.critical .tag{color:var(--red)}.metrics{grid-template-columns:repeat(4,1fr)}.metric-name{color:var(--muted);display:flex;justify-content:space-between}.metric-value{font-size:27px;font-weight:750;margin:9px 0}.metric-value small{font-size:12px;color:var(--muted)}.metric p{margin:0;min-height:40px}.meter{height:5px;background:#222d3e;margin-top:12px;border-radius:4px;overflow:hidden}.meter i{height:100%;display:block;background:var(--blue)}.error{display:none;background:#38171c;border:1px solid #82313d;padding:12px;border-radius:8px;margin-bottom:12px}.loading{opacity:.55}footer{color:var(--muted);margin:28px 0 8px;border-top:1px solid var(--line);padding-top:16px}@media(max-width:900px){.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:540px){main{padding:18px}.metrics{grid-template-columns:1fr}header{align-items:start;flex-direction:column}}
</style></head><body><main id="app"><header><div><div class="eyebrow">MULTIDEPLOY · 2×A2</div><h1>vLLM 性能诊断台</h1><div class="muted">自动告诉你 GLM-5.3-Flash 卡在哪里</div></div><div><button onclick="load()">立即检测</button><button class="ghost" onclick="location.href='/api/report'">导出文本</button></div></header><div id="error" class="error"></div><div class="section-head"><h2>瓶颈结论</h2><span id="updated" class="muted">正在连接…</span></div><section id="findings" class="findings"></section><div class="section-head"><h2>关键性能指标</h2><span class="muted">每 30 秒刷新</span></div><section id="metrics" class="metrics"></section><footer>判断原则：KV &gt; 90% + Waiting &gt; 0 才是明确容量压力；TTFT 变高必须结合 Prompt 长度。</footer></main>
<script>
const defs=[['running','正在运行','请求','有业务时大于 0 正常'],['waiting','等待队列','请求','持续大于 0 表示开始排队'],['kv','KV Cache 最高占用','%','低于 80% 安全，90% 以上危险'],['imbalance','Engine 占用差','%','持续超过 40% 才需处理'],['ttft','首字延迟 P95','秒','95% 请求看到首字的时间'],['e2e','总延迟 P95','秒','包含生成完整回答的时间'],['prompt','Prompt 长度 P95','tokens','结合 TTFT 判断长上下文成本'],['cache','前缀缓存命中','%','相同公共前缀多时越高越好'],['preempt','近 1 小时抢占','次','应为 0，增长表示 KV 压力'],['input_tps','输入吞吐','tokens/s','Prefill 总处理速度'],['output_tps','输出吞吐','tokens/s','所有请求总输出速度'],['length_rate','触顶结束比例','%','过高时检查 max_tokens']];
function f(v){return v==null?'暂无数据':Math.round(v*100)/100}function draw(d){document.getElementById('updated').textContent='更新时间 '+d.collected_at;document.getElementById('findings').innerHTML=d.findings.map(x=>`<article class="finding ${x[0]}"><span class="tag">${x[0]=='critical'?'立即处理':x[0]=='warning'?'值得关注':'状态正常'}</span><b>${x[1]}</b><span class="muted">${x[2]}</span></article>`).join('');document.getElementById('metrics').innerHTML=defs.map(x=>{let v=d.values[x[0]],bar=['kv','imbalance','cache','length_rate'].includes(x[0])?`<div class="meter"><i style="width:${Math.min(100,Math.max(0,v||0))}%"></i></div>`:'';return `<article class="metric"><div class="metric-name">${x[1]}</div><div class="metric-value">${f(v)} <small>${v==null?'':x[2]}</small></div><p>${x[3]}</p>${bar}</article>`}).join('')}
async function load(){let app=document.getElementById('app'),err=document.getElementById('error');app.classList.add('loading');err.style.display='none';try{let r=await fetch('/api/status');if(!r.ok)throw Error('HTTP '+r.status);draw(await r.json())}catch(e){err.textContent='读取失败：'+e.message;err.style.display='block'}finally{app.classList.remove('loading')}}load();setInterval(load,30000);
</script></main></body></html>
